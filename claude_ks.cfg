# ==============================================================================
# fedzen3 - unified kickstart: Fedora (latest) KDE Plasma 6 on AMD Zen 3 + Radeon
# Merges everything from fedora_kde.ks, fedora-cacyos.ks, kde.ks, ks.cfg, ks_var.cfg
# One kernel strategy only: CachyOS (x86_64_v3). Stock Fedora kernel is KEPT as fallback.
# Secure Boot: CachyOS kernel is unsigned -> disable Secure Boot or enroll a MOK key.
#
# ---- REMARKS: commands dropped or changed vs. the original repo files --------
# DROPPED (ks.cfg)
#   dnf_options --setopt=arch=x86_64-v3 ...   Not a valid kickstart command (the
#       validator rejects it). v3 comes from the CachyOS kernel; DNF speed options
#       moved to /etc/dnf/dnf.conf in %post (section A).
#   glibc.x86_64-v3, openssl.x86_64-v3        Fedora does not ship such packages
#       (glibc picks v3 libs at runtime via hwcaps), so the install would fail.
#   kernel-zen, kernel-zen-devel (COPR)       Conflicting second kernel strategy;
#       replaced by the CachyOS kernel. "zen" there meant the Zen kernel, not Zen 3.
#   -kernel -kernel-core -kernel-modules -kernel-devel   Removing stock kernels
#       leaves no fallback if the third-party kernel fails to boot. Kept installed.
#   %packages --exclude-weakdeps              Wrong spelling (--excludeWeakdeps) and
#       unsafe for a KDE install (can drop firmware/drivers). Not used.
#   copr-linux-zen-fedora repo                Dropped together with kernel-zen.
# DROPPED (fedora_kde.ks / fedora-cacyos.ks)
#   repo ... --priority=10                    Replaced by --cost=500 (kickstart repo option).
#   cat > /etc/dnf/dnf.conf                   Overwrote the whole file; now appended.
#   fastestmirror=True, default_vendor_change, zstd_clevel   Not valid dnf5 options
#       (ignored or warned about); only max_parallel_downloads is kept.
#   systemctl enable --now ...                --now cannot start services inside the
#       install chroot; plain enable is used in %post (section K).
#   part biosboot + bootloader --location=mbr  Mixed BIOS/UEFI layout; layout is
#       UEFI-only now (EFI partition from ks_var.cfg).
#   ananicy types "Realtime" / "Important"    Not defined ananicy types; replaced
#       with explicit nice/ionice values (section E).
#   /etc/environment for session flags        Moved to /etc/environment.d/ (more
#       reliable for the Plasma 6 user session).
# DROPPED (kde.ks / ks_var.cfg)
#   ignoredisk sda / --ondisk=nvme0n1         Hard-coded disks; auto-detected in %pre.
#   autopart --type=btrfs                     Replaced by the explicit ks_var.cfg layout.
#   btrfs ... --opts="compress=zstd:3,ssd,discard=async"   --opts is not valid for
#       the btrfs command; zstd:3 is applied by edi