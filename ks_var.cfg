# Clear existing partitions and initialize disk labels
clearpart --all --initlabel

# Standard EFI and Boot partitions (Required for UEFI systems)
part /boot/efi --fstype=efi --size=600 --ondisk=sda
part /boot --fstype=ext4 --size=1024 --ondisk=sda

# Dedicated 30GB ext4 partition for /var
part /var --fstype=ext4 --size=30720 --fixed --ondisk=sda

# Btrfs Volume layout for root with zstd:3 compression
part btrfs.01 --size=1 --grow --ondisk=sda
btrfs none --label=fedora btrfs.01
btrfs / --subvol --name=root --opts="compress=zstd:3,ssd,discard=async" fedora
