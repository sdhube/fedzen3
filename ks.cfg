# ==============================================================================
# Fedora Everything Netinst Kickstart Configuration
# Target: AMD Zen 3 + Radeon RX 6600 (Clean, Low-Latency KDE Setup)
# ==============================================================================

# Use text-based installer or graphical
text

# Language and Timezone Configuration
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
timezone UTC --isUtc

# Network Configuration (Required for Netinst)
network --bootproto=dhcp --device=link --activate

# Repository Configuration - FIXED to point to the actual mirrorlist API
url --mirrorlist="https://fedoraproject.org"

# ------------------------------------------------------------------------------
# 1. Add Community Zen Kernel COPR Repository - FIXED path to explicit repo directory
# ------------------------------------------------------------------------------
repo --name=copr-linux-zen-fedora --baseurl=https://fedorainfracloud.org

# ------------------------------------------------------------------------------
# 2. DNF Engine Optimization Options
# ------------------------------------------------------------------------------
dnf_options --setopt=install_weak_deps=False --setopt=arch=x86_64-v3 --setopt=max_parallel_downloads=10 --setopt=fastestmirror=True

# Run the installer setup
bootloader --location=mbr --append="amd_pstate=active amdgpu.ppfeaturemask=0xffffffff"
clearpart --all --initlabel
autopart

# Setup a default administrative user (Change username/password as needed)
user --name=amduser --groups=wheel --password=changeme --plaintext

# ------------------------------------------------------------------------------
# 3. Package Selection Section
# ------------------------------------------------------------------------------
%packages --exclude-weakdeps
# Base Environment
@kde-desktop-environment

# Hardware-Optimized Runtime Libraries
glibc.x86_64-v3
openssl.x86_64-v3

# Zen Kernel Installation from COPR
kernel-zen
kernel-zen-devel

# Remove stock kernels to ensure clean Zen boot
-kernel
-kernel-core
-kernel-modules
-kernel-devel
%end

# ------------------------------------------------------------------------------
# 4. Post-Installation Configuration Scripts
# ------------------------------------------------------------------------------
%post --log=/root/ks-post.log
# Set default boot engine to graphical interface
systemctl set-default graphical.target

# Re-verify and enforce bootloader configuration for the Zen kernel
if [ -f /usr/sbin/grubby ]; then
    /usr/sbin/grubby --update-kernel=ALL --args="amd_pstate=active amdgpu.ppfeaturemask=0xffffffff"
fi
%end

# Reboot automatically when finished
reboot



